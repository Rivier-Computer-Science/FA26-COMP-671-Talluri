# Hyperparameters and settings read by plant_leaf_disease.ipynb (the notebook's SMOKE=1 mode overrides epochs and per_class).
seed: 42             # data split, initialization, shuffling, noise
img: 160             # images are resized from 256x256 to img x img
epochs: 12           # maximum epochs for the neural models
batch_size: 64
lr: 0.001            # Adam learning rate
weight_decay: 0.0001
patience: 4          # early stopping on validation macro-F1
val_frac: 0.15       # fraction of the official train split held out for validation
per_class: null      # null = use all images; an integer = cap images per class and split (used by SMOKE=1)
